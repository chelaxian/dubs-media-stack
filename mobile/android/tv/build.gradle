plugins { id 'com.android.application' }
android {
 namespace 'app.dubs.panel'
 compileSdk 36
 defaultConfig { applicationId 'app.dubs.panel.tv'; minSdk 28; targetSdk 36; versionCode 7; versionName '1.4.0-tv' }
 sourceSets { main { java.srcDirs = ['../app/src/main/java']; res.srcDirs = ['../app/src/main/res','src/main/res'] } }
 signingConfigs { release { storeFile file(System.getenv('DUBS_KEYSTORE') ?: '/tmp/dubs-signing.p12'); storePassword System.getenv('DUBS_SIGNING_PASSWORD'); keyAlias 'dubs'; keyPassword System.getenv('DUBS_SIGNING_PASSWORD'); storeType 'PKCS12' } }
 buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
