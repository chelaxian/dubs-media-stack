name: CI

# Two independent jobs:
#   offline  — hermetic unit suite, byte-compilation, secret scan and compose
#              interpolation; runs anywhere (no daemon needed for the checks
#              except `docker compose config`, which only parses).
#   smoke    — REAL services: fresh compose project on the runner's Docker,
#              generated API keys, real installer.bootstrap against the live
#              APIs, idempotence and Transmission credential checks.
#              This is the ONLY place fresh-host success is claimed.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# Read-only token: CI never needs to write repositories, packages or releases.
permissions:
  contents: read

jobs:
  offline:
    name: offline tests + compile + secrets + compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime deps
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt PyYAML

      - name: Byte-compile everything
        run: python3 -m compileall -q src automations installer tests mobile

      - name: Offline unit suite (no Docker daemon usage, no skips)
        run: sudo "$(command -v python3)" -m unittest discover -s tests -p 'test_*.py' -v

      - name: Secret scan (personal hosts/IPs/keys must not leak)
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path
          skip_dirs = {'.git', '__pycache__', 'node_modules', '.venv'}
          allow = re.compile(r'127\.0\.0\.1|0\.0\.0\.0|192\.0\.2\.|198\.51\.100\.|'
                             r'203\.0\.113\.|example\.org|localhost')
          bad = re.compile(
              r'ratu\.sh|dubs\.pve|'
              r'(?<![\d.])10\.11\.\d+\.\d+|'
              r'(?<![\d.])192\.168\.\d+\.\d+|'
              r'(?<![\d.])172\.1[6-9]\.(?!18\.0\.1)\d+\.\d+|'
              r'AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----')
          # Synthetic Docker-gateway fixtures from the unit suite. Stripped
          # ONLY on lines of tests/test_install_security.py, so any other
          # secret sharing those lines is still scanned.
          fixture_file = 'tests/test_install_security.py'
          # Assembled from fragments so this heredoc itself never contains
          # a literal fixture IP (the scan covers this file too).
          fixture_ips = ('172.18.' + '0.1',
                         '172.19.' + '0.1',
                         '192.168.' + '5.1')
          hits = []
          for p in Path('.').rglob('*'):
              if not p.is_file() or skip_dirs & set(p.parts):
                  continue
              try:
                  text = p.read_text(errors='replace')
              except (OSError, ValueError):
                  continue
              strip_fixture_ips = p.as_posix() == fixture_file
              for i, line in enumerate(text.splitlines(), 1):
                  if strip_fixture_ips:
                      for ip in fixture_ips:
                          line = line.replace(ip, '')
                  if bad.search(line) and not allow.search(line):
                      hits.append('%s:%d: %s' % (p, i, line.strip()[:120]))
          if hits:
              print('\n'.join(hits))
              sys.exit(1)
          print('secret scan: clean')
          PY

      - name: compose config (interpolation + schema validation)
        run: |
          cd compose
          cp .env.example .env
          sed -i "s|^MEDIA_ROOT=$|MEDIA_ROOT=/tmp/dubs-ci-media|; s|^DUBS_DATA_ROOT=$|DUBS_DATA_ROOT=/tmp/dubs-ci-data|" .env
          mkdir -p /tmp/dubs-ci-media /tmp/dubs-ci-data
          touch /tmp/dubs-ci-media/.dubs-storage-ok
          mkdir -p /tmp/dubs-ci-data/{sonarr,radarr,lidarr,transmission,prowlarr,jellyfin,jellyfin-cache,seerr}
          docker compose --profile extras config -q && echo "compose config: OK"
          rm -f .env

  smoke:
    name: fresh-host bootstrap smoke (real services)
    runs-on: ubuntu-latest
    needs: offline
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime deps
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt PyYAML

      - name: Real-services smoke (isolated compose project, temp storage)
        env:
          DUBS_SMOKE: '1'
        run: python3 tests/integration_smoke.py -v

      - name: Diagnostics on failure
        if: failure()
        run: |
          docker ps -a || true
          docker logs dubs-sonarr --tail 100 2>&1 || true
          docker logs dubs-prowlarr --tail 100 2>&1 || true
          docker logs dubs-transmission --tail 100 2>&1 || true
